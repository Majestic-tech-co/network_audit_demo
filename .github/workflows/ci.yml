name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new advisories appear without any commit

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-for-testing-only-0123456789abcdef
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Migrations apply to an empty Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: alembic upgrade head
      - name: Models match migrations (fails if a model change has no migration)
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: alembic check
      - name: Downgrade and re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: |
          alembic downgrade base
          alembic upgrade head

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=moderate

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
          SECRET_KEY: ci
          ENCRYPTION_KEY: ci
        run: docker compose config --quiet
