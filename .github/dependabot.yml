version: 2
updates:
  # Minor/patch updates arrive as one PR per ecosystem. Major bumps of the tools below need
  # code changes (or other upgrades first), so they are done by hand when planned.
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: httpx          # 0.28 breaks the pinned anthropic/openai SDKs (proxies=); upgrade those first
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: anthropic
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: openai
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: pytest         # pytest-asyncio is pinned to a release that needs pytest 8
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss     # v4 needs a config migration
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python         # move Python versions deliberately
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node           # stay on an LTS line (even-numbered); bump by hand
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
